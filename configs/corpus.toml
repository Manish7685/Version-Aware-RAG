[release_posts]
# Owner instruction (2026-11-21): the presence of a repository MIT licence is recorded separately
# from its applicability to website text, which the inspected evidence does not establish.
repository_licence = "MIT"
repository_licence_file = "LICENSE"
repository_copyright = "Copyright 2018-2025 Stichting DuckDB Foundation"
repository_copyright_end_year = 2025
licence_applicability = "uncertain"
licence_status = "unverified"
licence_basis = "The duckdb-web repository contains an MIT LICENSE (copyright Stichting DuckDB Foundation) that grants rights in 'this software and associated documentation files'. No repository file states that this licence, or any other, covers website or blog text; the site footer is a copyright notice without a licence. Applicability to the release posts is therefore not established."
evidence_inspected = [
  "LICENSE: MIT; 'Copyright 2018-2025 Stichting DuckDB Foundation'; scope: 'this software and associated documentation files (the Software)'",
  "README.md: no licence statement",
  "CONTRIBUTING.md: explains how to submit blog posts; states no licence terms for contributed text",
  "_includes/footer.html: copyright notice only, '(c) {current year} DuckDB Foundation, Amsterdam NL'",
  "trademark_guidelines.md: 'The DuckDB project is published under the MIT open-source software license' (software, not website text)",
  "the 17 posts: no file-level licence or copyright notice; authors 'The DuckDB team'",
]
resolution_evidence = [
  "an explicit statement in duckdb-web (LICENSE, README, CONTRIBUTING or the site footer) that website and blog content is covered by the MIT licence or another named licence",
  "written confirmation from the DuckDB Foundation that the blog posts may be redistributed, and under which terms",
  "an updated LICENSE whose copyright line covers the 2026 posts and whose scope explicitly includes website content",
]
