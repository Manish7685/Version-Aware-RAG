[[probes]]
id = "P24"
# MERGE INTO with multiple matching source rows (unresolved; 2.0 docs example)
kind = "sql"
language = "sql"
capture = "first_value"
code = "CREATE TABLE target (id INTEGER, v INTEGER);INSERT INTO target VALUES (1, 0);CREATE TABLE source (id INTEGER, v INTEGER);INSERT INTO source VALUES (1, 10), (1, 20);MERGE INTO target USING source ON target.id = source.id WHEN MATCHED THEN UPDATE SET v = source.v;SELECT v FROM target"

