# ---------------------------------------------------------------------------------------------
# IR-3 probe suite (RAG-M4 S1b; RAG-M3_IR3_report.md §3; owner decision D3).
#
# P01-P10 carry the RAG-M1 probes forward with their recorded code (rag_m1_name links each one to
# scripts/probes/rag_m1_probes.py, which stays hash-pinned and unchanged) and the same capture
# rule: the repr of the first value, or of the Python expression's result. Errors are now
# captured in full ("<ExceptionType>: <complete message>"), never truncated.
#
# kind is the RuntimeObservation probe_kind. Controls must give the same result in every package
# in one run, otherwise the whole run is invalid:
#   P09 - error-path control (RAG-M1);
#   C1  - success-path control, expected value declared (RAG-M1 evidence §4.2);
#   C2  - whole-result control, expected value declared. Its comparison replaces only the
#         package's own version identifier ("v" + package version, as returned by version())
#         with a fixed placeholder; no other value, number, error or field is normalised.
# Stored observations always keep the raw, unnormalised value.

[[probes]]
id = "P01"
rag_m1_name = "P01_map_bracket"
kind = "sql"
language = "sql"
capture = "first_value"
code = "SELECT map(['k'], ['v'])['k']"

[[probes]]
id = "P02"
rag_m1_name = "P02_date_trunc_type"
kind = "sql"
language = "sql"
capture = "first_value"
code = "SELECT typeof(date_trunc('month', DATE '2026-03-27'))"

[[probes]]
id = "P03"
rag_m1_name = "P03_float_div_zero"
kind = "sql"
language = "sql"
capture = "first_value"
code = "SELECT 1 / 0"

[[probes]]
id = "P04"
rag_m1_name = "P04_int_div_zero"
kind = "sql"
language = "sql"
capture = "first_value"
code = "SELECT 1 // 0"

[[probes]]
id = "P05"
rag_m1_name = "P05_arrow_lambda"
kind = "sql"
language = "sql"
capture = "first_value"
code = "SELECT list_transform([1, 2], x -> x + 1)"

[[probes]]
id = "P06"
rag_m1_name = "P06_python_lambda"
kind = "sql"
language = "sql"
capture = "first_value"
code = "SELECT list_transform([1, 2], lambda x: x + 1)"

[[probes]]
id = "P07"
rag_m1_name = "P07_merge_into"
kind = "sql"
language = "sql"
capture = "first_value"
code = "CREATE TABLE t(id INTEGER, v INTEGER); INSERT INTO t VALUES (1, 10);CREATE TABLE s(id INTEGER, v INTEGER); INSERT INTO s VALUES (1, 99);MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET v = s.v;SELECT v FROM t"

[[probes]]
id = "P08"
rag_m1_name = "P08_untyped_null_column"
kind = "sql"
language = "sql"
capture = "first_value"
code = "CREATE TABLE n AS SELECT NULL AS x;SELECT column_type FROM (DESCRIBE n)"

[[probes]]
id = "P09"
rag_m1_name = "P09_control_scalar_subquery_multirow"
kind = "control"
language = "sql"
capture = "first_value"
code = "SELECT (SELECT * FROM range(2))"

[[probes]]
id = "P10"
rag_m1_name = "P10_python_relation_fetchone"
kind = "python_api"
language = "python"
capture = "repr"
code = "con.sql(\"SELECT 42\").fetchone()"

[[probes]]
id = "C1"
kind = "control"
language = "sql"
capture = "first_value"
code = "SELECT (SELECT * FROM range(1))"
expected_status = "ok"
expected_value = "0"

[[probes]]
id = "C2"
kind = "control"
language = "sql"
capture = "all_rows"
code = "SELECT i, s, d, version() AS v FROM (VALUES (1, 'a', CAST(NULL AS INTEGER)), (2, 'b', CAST(7 AS INTEGER))) AS t(i, s, d) ORDER BY i"
normalize = "package_version"
expected_status = "ok"
expected_value = "[(1, 'a', None, '<duckdb-version>'), (2, 'b', 7, '<duckdb-version>')]"

