# Behavioural-test packages for the probe suite (RAG-M4; owner decision D2).
#
# One DuckDB package per documentation version, with the sha256 of its cp312 wheel for each
# platform, exactly as pinned in docs/design/RAG-M1_version_manifest.md §2. The same two hashes
# are in scripts/probes/requirements/duckdb-<version>.txt, which installs with --require-hashes.
# tests/unit/test_probe_pins.py checks this file against both. 1.1.3 is the reference package
# ("ref"), not a corpus version.

