# Protocol v0 (protocol_v0.toml) is unchanged; v1 amends only what is listed here (protocol_v1.md).

version = "v1"
amends = "v0"
answer_types = ["value", "type_name", "identifier", "version", "yes_no", "sql_expression", "none"]

[pilot_composition]
T1 = 13
T2 = 6
T3 = 12
T4 = 7
T5 = 12
t2_min_sets_spanning_three_versions = 2

[rules]
t2_requires_each_versions_own_documentation = true
documentation_corrections_are_diagnostic_only = true
t5_has_no_evidence_span = true
# Owner decision D3 (2026-11-24): drafting checks, applied by `vrag benchmark pilot screen`.
t4_no_single_span_answers_alone = true
t5_feature_absent_in_target_version = true
t5_no_documented_alternative_in_target_version = true
t5_no_redundant_version_pairs = true

